name: CI/CD Pipeline

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  code-quality-and-tests:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cinema_user
          POSTGRES_PASSWORD: cinema_password
          POSTGRES_DB: cinema_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Check code formatting with Black
        run: poetry run black --check src tests

      - name: Lint with Flake8
        run: poetry run flake8 src tests --max-line-length=88 --extend-ignore=E203,W503

      - name: Type check with Mypy
        run: poetry run mypy src

      - name: Run migrations with Alembic
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: cinema_user
          POSTGRES_PASSWORD: cinema_password
          POSTGRES_DB: cinema_db
        run: poetry run alembic upgrade head

      - name: Run tests with Pytest & Coverage
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: cinema_user
          POSTGRES_PASSWORD: cinema_password
          POSTGRES_DB: cinema_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  deploy:
    name: Deploy to AWS EC2
    needs: code-quality-and-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Simulating automated deployment pipeline to AWS EC2..."
          echo "Target Host: $EC2_HOST"
          echo "Deployment step completed successfully."